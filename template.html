<title>Bears Depth Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one centered column — header, deck controls, a single flip card, answer buttons; a depth-chart reference view behind a tab. */
:root{
  --navy:#0B162A;          /* Bears navy */
  --orange:#C83803;        /* Bears orange */
  --bg:#EEF0F4;
  --surface:#FFFFFF;
  --fg:#0B162A;
  --muted:#56607A;
  --line:#D5DAE4;
  --chip:#E1E5EE;
  --card-front:#0B162A;
  --card-front-fg:#FFFFFF;
  --card-back:#FFFFFF;
  --card-back-fg:#0B162A;
  --good:#1F7A4A;
  --again:#C83803;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070E1C;--surface:#101C33;--fg:#EEF1F7;--muted:#9AA6BF;--line:#22324F;--chip:#1A2944;
  --card-front:#132241;--card-front-fg:#FFFFFF;--card-back:#F4F5F8;--card-back-fg:#0B162A;--good:#3FB37A;--again:#F0662F;--orange:#E2541B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070E1C;--surface:#101C33;--fg:#EEF1F7;--muted:#9AA6BF;--line:#22324F;--chip:#1A2944;
  --card-front:#132241;--card-front-fg:#FFFFFF;--card-back:#F4F5F8;--card-back-fg:#0B162A;--good:#3FB37A;--again:#F0662F;--orange:#E2541B;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
@media (max-width:440px){.tab{padding:10px 8px;font-size:14px;letter-spacing:.04em}}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{background:var(--navy);color:#fff;margin-inline:-16px;padding:18px 16px 0;border-bottom:4px solid var(--orange)}
header .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,44px);line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--orange)}
.asof{font-family:var(--f-label);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#AEB8CC}
.tabs{display:flex;gap:4px}
.tab{appearance:none;border:0;background:transparent;color:#AEB8CC;font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--orange);color:#fff}
.tab:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.controls{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin-top:-16px}
.fbar{appearance:none;width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--fg);font:inherit;text-align:left}
.fbar[aria-expanded="true"]{border-radius:12px 12px 0 0}
.fbar .fl{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);flex:none}
.fbar .fs{font-family:var(--f-label);font-weight:600;font-size:15px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .chev{flex:none;transition:transform .2s;color:var(--muted);font-size:14px}
.fbar[aria-expanded="true"] .chev{transform:rotate(180deg)}
.rlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rrow{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) 36px 84px;align-items:center;gap:10px;padding:9px 14px}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--chip)}
.rrow .rn{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--orange);font-variant-numeric:tabular-nums;text-align:right}
.rrow .rname{font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.rrow .rname small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.rrow .rpos{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;font-size:14px}
.rrow .rdep{font-family:var(--f-label);font-weight:600;font-size:13px;color:var(--muted);text-align:right}
.rrow .rdep.s1{color:var(--orange)}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rhead h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px;margin:0}
.rhead p{margin:0;font-size:14px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(7,14,28,.75);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.rdetail{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--chip);border-bottom:1px solid var(--line)}
.rdetail .face.mcard{border-radius:12px;box-shadow:none}
.rrow[aria-expanded="true"]{background:var(--navy);color:#fff}
.rrow[aria-expanded="true"] .rname small,.rrow[aria-expanded="true"] .rdep{color:#AEB8CC}
.mclose{align-self:stretch;appearance:none;border:0;background:var(--orange);color:#fff;font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:8px;cursor:pointer}
.face.mcard{position:relative;inset:auto;transform:none;overflow:auto;min-height:0;flex:0 1 auto}
.mcard .roles{overflow:visible}
.mcard .bio{margin-top:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-family:var(--f-label);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:72px;flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--f-label);font-weight:600;font-size:15px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange)}}
.chip small{opacity:.7;font-weight:500;margin-left:3px}

.progress{display:flex;flex-direction:column;gap:6px}
.pmeta{display:flex;justify-content:space-between;font-family:var(--f-label);font-size:14px;font-weight:600;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.pmeta b{color:var(--fg)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .a{background:var(--again)}

/* Card */
.stage{perspective:1400px}
.card{position:relative;width:100%;height:clamp(360px,calc(100svh - 270px),500px);max-width:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);border:0;padding:0;background:none;display:block;font:inherit;color:inherit;text-align:left}

.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;padding:20px 22px;box-shadow:0 10px 30px -12px rgba(11,22,42,.45)}
.front{background:var(--card-front);color:var(--card-front-fg)}
.front::before{content:"";position:absolute;left:0;right:0;top:56px;height:10px;background:repeating-linear-gradient(90deg,var(--orange) 0 100%);opacity:.95;box-shadow:0 16px 0 -4px #fff,0 26px 0 -4px var(--orange)}
.back{background:var(--card-back);color:var(--card-back-fg);transform:rotateY(180deg);border:1px solid var(--line);overflow-y:auto}
.ftop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px}
.front .pill{background:rgba(255,255,255,.1);color:#fff}
.back .pill{background:#E7EAF1;color:#0B162A}
.pill.s1{background:var(--orange)!important;color:#fff!important}
.fmain{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding-top:30px;min-height:0}
.q{font-family:var(--f-label);font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#AEB8CC}
.bignum{font-family:var(--f-display);font-weight:900;font-size:clamp(120px,36vw,190px);line-height:.82;color:#fff;-webkit-text-stroke:3px var(--orange);paint-order:stroke fill;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigname{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,11vw,64px);line-height:.95;text-transform:uppercase;text-wrap:balance}
.hint{font-family:var(--f-label);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7F8BA6;text-align:center}

.bhead{display:flex;align-items:center;gap:16px;margin-top:10px}
.bnum{font-family:var(--f-display);font-weight:900;font-size:76px;line-height:.85;color:var(--orange);font-variant-numeric:tabular-nums;flex:none;min-width:2ch;text-align:center}
.bname{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7.5vw,40px);line-height:.95;text-transform:uppercase;min-width:0;text-wrap:balance}
.bpos{font-family:var(--f-label);font-weight:600;font-size:15px;color:#56607A;letter-spacing:.04em;margin-top:4px}
.roles{flex-shrink:0;list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:2px solid #0B162A;display:flex;flex-direction:column;gap:8px;font-size:15px;overflow:auto;min-height:0}
.roles li{display:flex;flex-direction:column;gap:1px}
.roles .r1{font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.roles .r2{color:#3D4760}
.roles .r2 b{font-variant-numeric:tabular-nums;color:#0B162A}
.stats{margin-top:12px;padding-top:10px;border-top:1px solid #D5DAE4;display:flex;flex-direction:column;gap:8px}
.stats .sh{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.sg{display:flex;align-items:baseline;gap:12px}
.tiles{display:flex;flex-wrap:wrap;gap:4px 14px;min-width:0;flex:1}
.sg .cat{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#56607A;width:76px;flex:none}
.st{display:flex;align-items:baseline;gap:4px}
.st b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;color:#0B162A;font-variant-numeric:tabular-nums}
.st span{font-family:var(--f-label);font-weight:600;font-size:13px;color:#56607A;letter-spacing:.03em}
.nostats{font-size:14px;color:#56607A;font-style:italic}
.bio{margin-top:auto;padding-top:10px;display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-label);font-size:14px;font-weight:600;color:#56607A;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.bio span b{color:#0B162A}

.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;border-radius:10px;padding:14px 10px;font-family:var(--f-label);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:#fff}
.btn.again{background:var(--again)}
.btn.good{background:var(--good)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.btn kbd{font-family:var(--f-label);font-size:12px;opacity:.75;margin-left:6px;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.keys{font-family:var(--f-label);font-size:13px;color:var(--muted);letter-spacing:.05em;text-align:center}

.done{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.done .score{font-family:var(--f-display);font-weight:900;font-size:84px;line-height:.9;color:var(--orange);font-variant-numeric:tabular-nums}
.done h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:30px;margin:0}
.done p{margin:0;color:var(--muted);max-width:44ch}
.done .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.done .btn{padding:12px 18px;font-size:16px;background:var(--navy)}
.missed{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.missed span{background:var(--chip);border-radius:999px;padding:3px 10px;font-family:var(--f-label);font-weight:600;font-size:14px}

/* Depth chart view */
.unit h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px;margin:6px 0 8px;display:flex;align-items:center;gap:10px}
.unit h2::after{content:"";flex:1;height:3px;background:var(--orange)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.pos{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;width:64px}
td .n{font-family:var(--f-display);font-weight:800;color:var(--orange);font-size:18px;margin-right:6px;font-variant-numeric:tabular-nums;display:inline-block;min-width:2ch}
td.s1{font-weight:600}
.src{font-size:13px;color:var(--muted)}
.plink{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.plink:hover{text-decoration-color:var(--orange)}
.src a{color:inherit}

@media (prefers-reduced-motion: reduce){.card{transition:none}}
@media (max-width:600px){
  header{padding-top:12px}
  header .in{gap:6px}
  h1{font-size:28px;white-space:nowrap}
  .asof{display:none}
  .tab{padding:8px 8px!important}
  #view-cards{gap:10px!important}
  .wrap{gap:12px}
  .face{padding:14px 16px}
  .bhead{margin-top:6px;gap:12px}
  .bnum{font-size:60px}
  .roles{margin-top:10px;padding-top:8px;gap:6px;font-size:14px}
  .stats{margin-top:8px;padding-top:8px;gap:6px}
  .st b{font-size:21px}
  .btn{padding:12px 10px;font-size:17px}
  .front::before{top:46px}
}
html{background:#0B162A!important}body{min-height:100vh}
</style>
</head>
<body>


<header>
  <div class="in">
    <div class="brand">
      <h1>Bears <span>Depth</span> Cards</h1>
      <div class="asof" id="asof"></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-cards" role="tab" aria-selected="true">Flashcards</button>
      <button class="tab" id="tab-roster" role="tab" aria-selected="false">Roster</button>
      <button class="tab" id="tab-chart" role="tab" aria-selected="false">Depth chart</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section id="view-cards" style="display:flex;flex-direction:column;gap:16px">
    <div><button class="fbar" id="ftoggle" type="button" aria-expanded="false" aria-controls="controls"><span class="fl">Filters</span><span class="fs" id="fsum"></span><span class="chev">▼</span></button></div>
    <div class="controls" id="controls" hidden>
      <div class="row"><span class="lbl">Deck</span><div class="seg" id="seg-deck"></div></div>
      <div class="row"><span class="lbl">Unit</span><div class="seg" id="seg-unit"></div></div>
      <div class="row"><span class="lbl">Ask</span><div class="seg" id="seg-dir"></div></div>
      <div class="row"><span class="lbl">Order</span><div class="seg" id="seg-order"></div></div>
    </div>

    <div class="progress" id="progress">
      <div class="pmeta"><span id="pcount"></span><span id="pscore"></span></div>
      <div class="bar"><i class="g" id="barg"></i><i class="a" id="bara"></i></div>
    </div>

    <div id="play">
      <div class="stage">
        <button class="card" id="card" aria-label="Flip card">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </button>
      </div>
    </div>
    <div class="answer" id="answer">
      <button class="btn again" id="btn-again" disabled>Again <kbd>←</kbd></button>
      <button class="btn good" id="btn-good" disabled>Got it <kbd>→</kbd></button>
    </div>
    <div class="keys" id="keys">Tap the card or press Space to flip</div>
    <div id="done" hidden></div>
  </section>

  <section id="view-roster" hidden style="flex-direction:column;gap:12px">
    <div class="rhead"><h2>Roster</h2><p>Tap a player to see his card</p></div>
    <div class="rlist" id="rlist"></div>
  </section>

  <section id="view-chart" hidden style="flex-direction:column;gap:18px"></section>

  <p class="src">Sources: <a href="https://www.chicagobears.com/team/depth-chart" target="_blank" rel="noopener">chicagobears.com depth chart</a>, <a href="https://www.chicagobears.com/team/players-roster/" target="_blank" rel="noopener">roster</a> and <a id="statslink" href="https://www.chicagobears.com/team/stats/" target="_blank" rel="noopener">regular-season stats</a>. <span id="srcinfo"></span></p>
</div>
<div id="errbar" hidden style="position:sticky;bottom:0;margin:0 -16px;padding:10px 16px;background:#B00020;color:#fff;font:14px/1.4 system-ui,sans-serif;z-index:9"></div>
<script>
window.addEventListener("error",e=>{const b=document.getElementById("errbar");if(!b)return;b.hidden=false;b.textContent="Error: "+(e.message||e.error)+" (line "+(e.lineno||"?")+")";});
// Data is filled in each week by build.mjs from chicagobears.com.
const DATA = __BEARS_DATA__;

const FULL={QB:"Quarterback",RB:"Running back",FB:"Fullback",WR:"Wide receiver",TE:"Tight end",LT:"Left tackle",LG:"Left guard",C:"Center",RG:"Right guard",RT:"Right tackle",OL:"Offensive line",
  DL:"Defensive line",DE:"Defensive end",DT:"Defensive tackle",NT:"Nose tackle",EDGE:"Edge rusher",LB:"Linebacker",ILB:"Inside linebacker",OLB:"Outside linebacker",MLB:"Middle linebacker",
  CB:"Cornerback",S:"Safety",SS:"Strong safety",FS:"Free safety",DB:"Nickel DB",NB:"Nickel back",
  K:"Kicker",P:"Punter",KO:"Kickoff",H:"Holder",LS:"Long snapper",KR:"Kick returner",PR:"Punt returner"};
const OFF_ORDER=["QB","RB","FB","WR","TE","LT","LG","C","RG","RT"];
const UNIT = {O:"Offense",D:"Defense",S:"Special teams"};
const DEPTH = ["Starter","2nd string","3rd string"];
const ord = d => ["1st","2nd","3rd"][d];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const P = DATA.players;
// Offense in a learner-friendly order (QB first); defense and special teams as the team lists them.
const SLOTS = DATA.slots.map((s,i)=>({...s,i})).sort((a,b)=>{
  const u="ODS".indexOf(a.unit)-"ODS".indexOf(b.unit); if(u) return u;
  if(a.unit==="O"){const ra=OFF_ORDER.indexOf(a.pos), rb=OFF_ORDER.indexOf(b.pos); const x=(ra<0?99:ra)-(rb<0?99:rb); if(x) return x;}
  return a.i-b.i;
});

document.getElementById("asof").textContent = DATA.asOf ? `Depth chart as of ${DATA.asOf}` : "";
document.getElementById("srcinfo").textContent = `Updated ${new Date(DATA.built+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}.${DATA.asOf?` Depth chart as of ${DATA.asOf}.`:""}`;
document.getElementById("statslink").textContent = `${DATA.season} regular-season stats`;
document.getElementById("statslink").href = `https://www.chicagobears.com/team/stats/${DATA.season}/REG`;

// ---------- Stats ----------
const n = v => { const x=parseFloat(v); return isNaN(x)?0:x; };
function fgTotals(fg){ let m=0,a=0; Object.values(fg).forEach(v=>{const [x,y]=String(v).split("-").map(Number); if(!isNaN(x)&&!isNaN(y)){m+=x;a+=y;}}); return [m,a]; }
function statGroups(slug){
  const s=DATA.stats[slug]; if(!s) return null;
  const g=[];
  if(s.passing){const p=s.passing; g.push(["Passing",[[`${p.COMP}/${p.ATT}`,"comp"],[p.YDS,"yds"],[p.TD,"TD"],[p.INT,"INT"],[p.RATE,"rating"]]]);}
  if(s.rushing){const r=s.rushing; g.push(["Rushing",[[r.ATT,"att"],[r.YDS,"yds"],[r["YDS/ATT"],"avg"],[r.TD,"TD"]]]);}
  if(s.receiving){const r=s.receiving; g.push(["Receiving",[[r.REC,"rec"],[r.YDS,"yds"],[r["YDS/REC"],"avg"],[r.TD,"TD"]]]);}
  if(s.tackles||s.interceptions){
    const t=s.tackles||{}, it=[];
    if(s.tackles){it.push([t.TOTAL,"tackles"],[t.SOLO,"solo"]); if(n(t.SCK)) it.push([t.SCK,n(t.SCK)===1?"sack":"sacks"]);}
    if(s.interceptions&&n(s.interceptions.INT)) it.push([s.interceptions.INT,"INT"]);
    if(n(t.F)) it.push([t.F,"FF"]);
    if(n(t.SFTY)) it.push([t.SFTY,"safety"]);
    if(it.length) g.push(["Defense",it]);
  }
  if(s.fg){const [m,a]=fgTotals(s.fg); const big=[s.fg["50-59"],s.fg["60+"]].map(v=>String(v||"0-0").split("-").map(Number)).reduce((x,y)=>[x[0]+y[0],x[1]+y[1]],[0,0]);
    g.push(["Kicking",[[`${m}/${a}`,"FG"],[`${big[0]}/${big[1]}`,"50+ yds"]]]);}
  if(s.punting){const p=s.punting; g.push(["Punting",[[p.PUNTS,"punts"],[p.AVG,"avg"],[p["NET AVG"],"net"],[p.LNG,"long"],[p["IN 20"],"inside 20"]]]);}
  if(s.kr){const k=s.kr; g.push(["Kick ret",[[k.RET,"ret"],[k.YDS,"yds"],[k["YDS/RET"],"avg"],[k.LNG,"long"]]]);}
  if(s.pr){const k=s.pr; g.push(["Punt ret",[[k.RET,"ret"],[k["YDS/RET"],"avg"],[k.LNG,"long"],[k.FC,"fair catch"]]]);}
  return g.length?g:null;
}
function statsHTML(slug){
  const g=statGroups(slug), pos=P[slug].pos;
  const body = g ? g.map(([cat,items])=>`<div class="sg"><span class="cat">${cat}</span><div class="tiles">${items.filter(([v])=>v!==undefined&&v!=="").map(([v,l])=>`<span class="st"><b>${esc(v)}</b><span>${l}</span></span>`).join("")}</div></div>`).join("")
    : `<div class="nostats">${pos==="OL"?"Offensive linemen don't get box-score stats.":pos==="LS"?"Long snappers don't get box-score stats.":`No stats in the team's posted ${DATA.season} tables yet.`}</div>`;
  return `<div class="stats"><div class="sh">${DATA.season} season to date</div>${body}</div>`;
}

// ---------- Build one card per player, filed under their highest spot on the chart ----------
const players = {};
SLOTS.forEach((s,si)=>{
  s.list.forEach((slug,d)=>{
    if(d>2||!P[slug]) return;
    const p = players[slug] ||= {slug, num:P[slug].num, roles:[], depth:9, unit:s.unit, si:999};
    p.roles.push({u:s.unit,pos:s.pos,full:FULL[s.pos]||s.pos,d,list:s.list,si});
    if (d<p.depth || (d===p.depth && si<p.si)) {p.depth=d;p.unit=s.unit;p.si=si;}
  });
});
const ALL = Object.values(players).sort((a,b)=>a.depth-b.depth||a.si-b.si);
ALL.forEach(p=>{ p.label=[...new Set(p.roles.filter(r=>r.d===p.depth).map(r=>r.pos))].join(" · "); });

// ---------- State ----------
const S = {deck:"0", unit:"A", dir:"num", order:"depth", queue:[], i:0, flipped:false, good:0, again:0, missed:[], total:0, firstTry:new Set(), seen:new Set()};
try{const s=JSON.parse(localStorage.getItem("bearsCards")||"{}");["deck","unit","dir","order"].forEach(k=>{if(s[k])S[k]=s[k]});}catch(e){}
const save=()=>{try{localStorage.setItem("bearsCards",JSON.stringify({deck:S.deck,unit:S.unit,dir:S.dir,order:S.order}))}catch(e){}};

const pool = (deck,unit)=>ALL.filter(p=>(deck==="all"||p.depth===+deck)&&(unit==="A"||p.unit===unit));

function seg(id,key,opts){
  const el=document.getElementById(id);
  el.innerHTML="";
  opts.forEach(([v,t,c])=>{
    const b=document.createElement("button");
    b.className="chip";b.type="button";b.id=`${id}-${v}`;
    b.setAttribute("aria-pressed",S[key]===v);
    b.innerHTML=t+(c!=null?`<small>${c}</small>`:"");
    b.onclick=()=>{S[key]=v;save();renderControls();startDeck();};
    el.appendChild(b);
  });
}
function renderControls(){
  seg("seg-deck","deck",[["0","Starters",pool("0",S.unit).length],["1","2nd string",pool("1",S.unit).length],["2","3rd string",pool("2",S.unit).length],["all","All in order",pool("all",S.unit).length]]);
  seg("seg-unit","unit",[["A","All"],["O","Offense"],["D","Defense"],["S","Special teams"]]);
  seg("seg-dir","dir",[["num","# → Name"],["name","Name → #"],["mix","Mixed"]]);
  seg("seg-order","order",[["depth","Depth order"],["shuffle","Shuffled"]]);
  const L={deck:{"0":"Starters","1":"2nd string","2":"3rd string","all":"All in order"},unit:{A:"All units",O:"Offense",D:"Defense",S:"Special teams"},dir:{num:"# → Name",name:"Name → #",mix:"Mixed"},order:{depth:"Depth order",shuffle:"Shuffled"}};
  document.getElementById("fsum").textContent=["deck","unit","dir","order"].map(k=>L[k][S[k]]).join(" · ");
}
document.getElementById("ftoggle").onclick=e=>{
  const c=document.getElementById("controls"), b=e.currentTarget;
  c.hidden=!c.hidden; b.setAttribute("aria-expanded",!c.hidden);
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startDeck(list){
  let q = list ? list.slice() : pool(S.deck,S.unit).slice();
  if (S.order==="shuffle") shuffle(q);
  S.queue=q.map(p=>({p, dir: S.dir==="mix" ? (Math.random()<.5?"num":"name") : S.dir}));
  S.i=0;S.good=0;S.again=0;S.missed=[];S.total=q.length;S.firstTry=new Set();S.seen=new Set();
  document.getElementById("done").hidden=true;
  ["play","answer","keys","progress"].forEach(id=>document.getElementById(id).hidden=false);
  show();
}

const tag = slug => `<b>#${esc(P[slug].num)}</b> ${esc(P[slug].name)}`;
function roleLines(p){
  return p.roles.filter(r=>r.d<=2).map(r=>{
    if (r.d===0){
      const backs=r.list.slice(1,3);
      return `<li><span class="r1">Starting ${esc(r.full)}</span><span class="r2">${backs.length?"Backup: "+backs.map((b,i)=>`${tag(b)}${backs.length>1?` (${ord(i+1)})`:""}`).join(", "):"No backup listed"}</span></li>`;
    }
    return `<li><span class="r1">${ord(r.d)}-string ${esc(r.full)}</span><span class="r2">Behind ${r.list.slice(0,r.d).map(tag).join(", ")}</span></li>`;
  }).join("");
}

function show(){
  const card=document.getElementById("card");
  card.classList.remove("flipped");S.flipped=false;
  document.getElementById("btn-again").disabled=true;
  document.getElementById("btn-good").disabled=true;
  if (S.i>=S.queue.length){return finish();}
  const {p,dir}=S.queue[S.i];
  const pl=P[p.slug];
  const tier=`<span class="pill ${p.depth===0?"s1":""}">${DEPTH[p.depth]}</span>`;
  const top=`<div class="ftop"><span>${UNIT[p.unit]} · ${esc(p.label)}</span>${tier}</div>`;
  document.getElementById("front").innerHTML = top + (dir==="num"
    ? `<div class="fmain"><div class="q">Who wears</div><div class="bignum">${esc(pl.num)}</div></div><div class="hint">Tap to flip</div>`
    : `<div class="fmain"><div class="q">What number is</div><div class="bigname">${esc(pl.name)}</div></div><div class="hint">Tap to flip</div>`);
  document.getElementById("back").innerHTML = backHTML(p);
  updateProgress();
}
function backHTML(p){
  const {name,pos,ht,wt,age,exp,col,num}=P[p.slug];
  const tier=`<span class="pill ${p.depth===0?"s1":""}">${DEPTH[p.depth]}</span>`;
  return `<div class="ftop"><span>${UNIT[p.unit]} · ${esc(p.label)}</span>${tier}</div>
    <div class="bhead"><div class="bnum">${esc(num)}</div><div style="min-width:0"><div class="bname">${esc(name)}</div><div class="bpos">${esc(pos)} · ${esc(col)}</div></div></div>
    <ul class="roles">${roleLines(p)}</ul>
    ${statsHTML(p.slug)}
    <div class="bio"><span><b>${esc(ht)}</b> ht</span><span><b>${esc(wt)}</b> lb</span><span>Age <b>${esc(age)}</b></span><span>${exp==="R"?"<b>Rookie</b>":`<b>${esc(exp)}</b> yrs exp`}</span></div>`;
}
function updateProgress(){
  const t=S.total||1;
  document.getElementById("pcount").innerHTML=`Card <b>${Math.min(S.i+1,S.queue.length)}</b> of <b>${S.queue.length}</b>${S.queue.length>S.total?" (with repeats)":""}`;
  document.getElementById("pscore").innerHTML=`<b>${S.good}</b> got it · <b>${S.again}</b> again`;
  document.getElementById("barg").style.width=(S.firstTry.size/t*100)+"%";
  document.getElementById("bara").style.width=(S.missed.length/t*100)+"%";
}
function flip(){
  if (S.i>=S.queue.length) return;
  S.flipped=!S.flipped;
  document.getElementById("card").classList.toggle("flipped",S.flipped);
  if (S.flipped){document.getElementById("btn-again").disabled=false;document.getElementById("btn-good").disabled=false;}
}
function grade(ok){
  if (!S.flipped || S.i>=S.queue.length) return;
  const item=S.queue[S.i], k=item.p.slug;
  const first=!S.seen.has(k); S.seen.add(k);
  if (ok){S.good++; if(first) S.firstTry.add(k);}
  else {S.again++; if(first) S.missed.push(item.p); S.queue.push({p:item.p,dir:item.dir});}
  S.i++;
  setTimeout(show, 160);
}
function finish(){
  ["play","answer","keys"].forEach(id=>document.getElementById(id).hidden=true);
  updateProgress();
  const d=document.getElementById("done");d.hidden=false;
  const deckName={"0":"starters","1":"2nd string","2":"3rd string","all":"full depth chart"}[S.deck];
  const next = S.deck==="0"?"1":S.deck==="1"?"2":null;
  d.innerHTML=`<h2>Deck complete</h2><div class="score">${S.firstTry.size}/${S.total}</div>
    <p>Right on the first try for the ${deckName}${S.unit!=="A"?" ("+UNIT[S.unit].toLowerCase()+")":""}.</p>
    ${S.missed.length?`<div class="missed">${S.missed.map(p=>`<span>#${esc(P[p.slug].num)} ${esc(P[p.slug].name)}</span>`).join("")}</div>`:""}
    <div class="acts">
      ${S.missed.length?`<button class="btn" id="b-missed" style="background:var(--again)">Drill the ${S.missed.length} missed</button>`:""}
      <button class="btn" id="b-again">Run it again</button>
      ${next?`<button class="btn" id="b-next" style="background:var(--good)">Next: ${next==="1"?"2nd":"3rd"} string</button>`:""}
    </div>`;
  const m=document.getElementById("b-missed"); if(m) m.onclick=()=>startDeck(S.missed);
  document.getElementById("b-again").onclick=()=>startDeck();
  const nx=document.getElementById("b-next"); if(nx) nx.onclick=()=>{S.deck=next;save();renderControls();startDeck();};
}

document.getElementById("card").onclick=flip;
document.getElementById("btn-again").onclick=()=>grade(false);
document.getElementById("btn-good").onclick=()=>grade(true);
document.addEventListener("keydown",e=>{
  if (e.key==="Escape" && !document.getElementById("view-roster").hidden){ closeCard(); return; }
  if (!document.getElementById("view-cards").hidden && !e.target.closest(".chip,.tab,.btn:not(.again):not(.good),.fbar")){
    if (e.key===" "||e.key==="Enter"){ if(e.target.id!=="btn-again"&&e.target.id!=="btn-good"){e.preventDefault();flip();} }
    else if (e.key==="ArrowRight"){grade(true)}
    else if (e.key==="ArrowLeft"){grade(false)}
  }
});

// ---------- Depth chart view ----------
function renderChart(){
  document.getElementById("view-chart").innerHTML=["O","D","S"].map(u=>{
    const rows=SLOTS.filter(s=>s.unit===u).map(s=>`<tr><td class="pos">${esc(s.pos)}</td>${[0,1,2].map(d=>{const k=s.list[d];return `<td class="${d===0?"s1":""}">${k&&P[k]?`<button class="plink" type="button" data-slug="${esc(k)}"><span class="n">${esc(P[k].num)}</span>${esc(P[k].name)}</button>`:"—"}</td>`;}).join("")}</tr>`).join("");
    return rows?`<div class="unit"><h2>${UNIT[u]}</h2><div class="tw"><table><thead><tr><th>Pos</th><th>Starter</th><th>2nd</th><th>3rd</th></tr></thead><tbody>${rows}</tbody></table></div></div>`:"";
  }).join("");
}
// ---------- Roster view ----------
function renderRoster(){
  const list=Object.values(players).sort((a,b)=>n(a.num)-n(b.num));
  const el=document.getElementById("rlist");
  el.innerHTML=list.map(p=>{
    const {name,pos,col,num}=P[p.slug];
    return `<button class="rrow" type="button" data-slug="${esc(p.slug)}"><span class="rn">${esc(num)}</span><span class="rname">${esc(name)}<small>${esc(col)}</small></span><span class="rpos">${esc(pos)}</span><span class="rdep ${p.depth===0?"s1":""}">${DEPTH[p.depth]}</span></button>`;
  }).join("");
  el.querySelectorAll(".rrow").forEach(b=>{
    b.onclick=()=>{ if (b.getAttribute("aria-expanded")==="true") closeCard(); else openCard(b.dataset.slug, b); };
  });
}
function closeCard(){
  const el=document.getElementById("rlist");
  el.querySelectorAll(".rdetail").forEach(d=>d.remove());
  el.querySelectorAll('.rrow[aria-expanded="true"]').forEach(r=>{r.setAttribute("aria-expanded","false");r.focus({preventScroll:true});});
}
function openCard(slug, row){
  closeCard();
  const d=document.createElement("div");
  d.className="rdetail";
  d.innerHTML=`<div class="face back mcard">${backHTML(players[slug])}</div><button class="mclose" type="button">✕ Close card</button>`;
  d.querySelector(".mclose").onclick=closeCard;
  row.parentNode.insertBefore(d,row.nextSibling);
  row.setAttribute("aria-expanded","true");
}

const VIEWS=["cards","roster","chart"];
function tab(which){
  VIEWS.forEach(v=>{
    const on=v===which;
    document.getElementById("tab-"+v).setAttribute("aria-selected",on);
    const sec=document.getElementById("view-"+v); sec.hidden=!on; sec.style.display=on?"flex":"";
  });
  if(which!=="roster") closeCard();
}
VIEWS.forEach(v=>document.getElementById("tab-"+v).onclick=()=>tab(v));

renderControls();renderChart();renderRoster();startDeck();
document.querySelectorAll("#view-chart .plink").forEach(b=>b.onclick=()=>{
  const k=b.dataset.slug; tab("roster");
  const row=document.querySelector(`.rrow[data-slug="${k}"]`);
  if(row){ openCard(k,row); row.scrollIntoView({block:"start"}); }
});
</script>
